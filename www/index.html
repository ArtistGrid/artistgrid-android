<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#000000" />
  <title>ArtistGrid</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header id="topbar">
    <button id="back" class="icon-btn" aria-label="Indietro" hidden>
      <svg viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg>
    </button>
    <h1 id="title">ArtistGrid</h1>
    <button id="fav-toggle" class="icon-btn" aria-label="Preferito" hidden>
      <svg viewBox="0 0 24 24"><path d="M12 21s-7-4.5-9.5-9A5.5 5.5 0 0 1 12 6a5.5 5.5 0 0 1 9.5 6c-2.5 4.5-9.5 9-9.5 9z"/></svg>
    </button>
  </header>

  <main id="view"></main>

  <div id="player" hidden>
    <div id="p-progress"><div id="p-bar"></div></div>
    <div class="p-row">
      <img id="p-cover" alt="" />
      <div class="p-meta">
        <div id="p-title"></div>
        <div id="p-sub"></div>
      </div>
      <button id="p-prev" class="icon-btn" aria-label="Precedente"><svg viewBox="0 0 24 24"><path d="M6 5v14M19 5l-10 7 10 7z"/></svg></button>
      <button id="p-play" class="icon-btn big" aria-label="Play/Pausa"><svg viewBox="0 0 24 24"><path id="p-play-icon" d="M7 4l13 8-13 8z"/></svg></button>
      <button id="p-next" class="icon-btn" aria-label="Successivo"><svg viewBox="0 0 24 24"><path d="M18 5v14M5 5l10 7-10 7z"/></svg></button>
    </div>
    <audio id="audio" preload="none"></audio>
  </div>

  <div id="toast" hidden></div>

  <script src="app.js"></script>
</body>
</html>
